<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AllRepos URL Manager</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  background:#0f1117;
  color:white;
  padding:20px;
}

.container{
  max-width:900px;
  margin:auto;
}

h1{
  margin-bottom:20px;
  font-size:32px;
}

.card{
  background:#1a1d26;
  padding:20px;
  border-radius:16px;
  margin-bottom:20px;
}

textarea{
  width:100%;
  height:180px;
  border:none;
  outline:none;
  resize:vertical;
  background:#0b0d12;
  color:white;
  border-radius:12px;
  padding:15px;
  margin-top:15px;
  font-size:15px;
}

button{
  background:#4f46e5;
  border:none;
  color:white;
  padding:12px 22px;
  border-radius:10px;
  cursor:pointer;
  font-size:16px;
  margin-top:15px;
}

button:hover{
  opacity:0.9;
}

#status{
  margin-top:15px;
  opacity:0.8;
}

.stats{
  margin-top:10px;
  opacity:0.7;
}

.url-item{
  background:#11141c;
  padding:14px;
  border-radius:10px;
  margin-top:12px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  flex-wrap:wrap;
}

.url-item a{
  color:#60a5fa;
  text-decoration:none;
  word-break:break-all;
  flex:1;
}

.delete-btn{
  background:#dc2626;
  padding:8px 14px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  color:white;
}

.delete-btn:hover{
  opacity:0.9;
}

small{
  opacity:0.7;
}

</style>
</head>
<body>

<div class="container">

  <h1>🔥 AllRepos URL Manager</h1>

  <div class="card">

    <h2>Add URLs</h2>

    <small>
      Paste one URL per line
    </small>

    <textarea id="urlInput" placeholder="https://github.com/example/file1.html
https://github.com/example/file2.js"></textarea>

    <button onclick="addUrls()">
      Add URLs
    </button>

    <div id="status"></div>

    <div class="stats" id="stats">
      0 URLs stored
    </div>

  </div>

  <div class="card">

    <h2>Stored URLs</h2>

    <div id="urlList"></div>

  </div>

</div>

<script>

/* =========================
   PUT YOUR TOKEN HERE
========================= */

const TOKEN = "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";

/* =========================
   YOUR REPO DETAILS
========================= */

const OWNER = "kaushalllbro";
const REPO = "allrepos";

const FILE_PATH = "urls.json";

const urlInput = document.getElementById("urlInput");
const urlList = document.getElementById("urlList");
const stats = document.getElementById("stats");
const statusDiv = document.getElementById("status");

/* =========================
   FETCH urls.json
========================= */

async function getFile(){

  const response = await fetch(
    `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`,
    {
      headers:{
        Authorization:`Bearer ${TOKEN}`
      }
    }
  );

  if(response.status === 404){

    return {
      urls:[],
      sha:null
    };

  }

  if(response.status === 401){

    statusDiv.innerText =
      "❌ Invalid token or permissions";

    throw new Error("401 Unauthorized");

  }

  const data = await response.json();

  let parsed = { urls:[] };

  try{

    const decoded = decodeURIComponent(
      escape(
        atob(data.content)
      )
    );

    parsed = JSON.parse(decoded);

  }catch(err){

    console.log(err);

    parsed = { urls:[] };

  }

  return {
    urls:parsed.urls || [],
    sha:data.sha
  };

}

/* =========================
   UPDATE urls.json
========================= */

async function updateGitHub(urls,sha){

  const jsonData = {
    updated:new Date().toISOString(),
    total:urls.length,
    urls:urls
  };

  const encoded = btoa(
    unescape(
      encodeURIComponent(
        JSON.stringify(jsonData,null,2)
      )
    )
  );

  const body = {
    message:"Updated urls.json",
    content:encoded
  };

  if(sha){
    body.sha = sha;
  }

  const response = await fetch(
    `https://api.github.com/repos/${OWNER}/${REPO}/contents/${FILE_PATH}`,
    {
      method:"PUT",
      headers:{
        Authorization:`Bearer ${TOKEN}`,
        "Content-Type":"application/json"
      },
      body:JSON.stringify(body)
    }
  );

  return response.ok;

}

/* =========================
   ADD URLS
========================= */

async function addUrls(){

  const enteredUrls = urlInput.value
    .split("\n")
    .map(url => url.trim())
    .filter(url => url.length > 0);

  if(enteredUrls.length === 0){
    return;
  }

  statusDiv.innerText =
    "⏳ Updating GitHub...";

  try{

    const file = await getFile();

    const urls = file.urls;

    enteredUrls.forEach(url => {

      if(!urls.includes(url)){
        urls.push(url);
      }

    });

    const success = await updateGitHub(
      urls,
      file.sha
    );

    if(success){

      statusDiv.innerText =
        "✅ urls.json updated successfully";

      urlInput.value = "";

      loadUrls();

    }else{

      statusDiv.innerText =
        "❌ Failed updating GitHub";

    }

  }catch(err){

    console.log(err);

  }

}

/* =========================
   DELETE URL
========================= */

async function deleteUrl(index){

  statusDiv.innerText =
    "⏳ Deleting URL...";

  try{

    const file = await getFile();

    const urls = file.urls;

    urls.splice(index,1);

    const success = await updateGitHub(
      urls,
      file.sha
    );

    if(success){

      statusDiv.innerText =
        "🗑️ URL deleted";

      loadUrls();

    }else{

      statusDiv.innerText =
        "❌ Failed deleting";

    }

  }catch(err){

    console.log(err);

  }

}

/* =========================
   LOAD URLS
========================= */

async function loadUrls(){

  try{

    const file = await getFile();

    urlList.innerHTML = "";

    file.urls.forEach((url,index)=>{

      const div = document.createElement("div");

      div.className = "url-item";

      div.innerHTML = `
        <a href="${url}" target="_blank">
          ${url}
        </a>

        <button class="delete-btn"
          onclick="deleteUrl(${index})">
          Delete
        </button>
      `;

      urlList.appendChild(div);

    });

    stats.innerText =
      file.urls.length + " URLs stored";

  }catch(err){

    console.log(err);

  }

}

loadUrls();

</script>

</body>
</html>
